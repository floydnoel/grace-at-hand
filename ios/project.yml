name: GraceAtHand
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Preview: debug
  Staging: debug
  Production: release
configFiles:
  Debug: Config/Defaults.xcconfig
  Release: Config/Defaults.xcconfig
  Preview: Config/Defaults.xcconfig
  Staging: Config/Defaults.xcconfig
  Production: Config/Defaults.xcconfig
packages:
  GraceCore:
    path: Packages/GraceCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: "$(GRACE_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      GRACE_ENVIRONMENT: fixture
    Release:
      GRACE_ENVIRONMENT: fixture
    Preview:
      GRACE_ENVIRONMENT: preview
      GRACE_CONTENT_BASE_URL: "http:/$()/127.0.0.1:8787/"
    Staging:
      GRACE_ENVIRONMENT: staging
    Production:
      GRACE_ENVIRONMENT: production
targets:
  GraceAtHand:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources/Media, Resources/ReadingLibrary]
      - path: App/Resources/Media
        type: folder
        buildPhase: resources
      - path: App/Resources/ReadingLibrary
        type: folder
        buildPhase: resources
    dependencies:
      - package: GraceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GRACE_BUNDLE_ID)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Grace at Hand
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock your private prayer space when you enable the optional app lock.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GraceEnvironment: "$(GRACE_ENVIRONMENT)"
        GraceContentBaseURL: "$(GRACE_CONTENT_BASE_URL)"
        GraceSupportURL: "$(GRACE_SUPPORT_URL)"
        GracePrivacyURL: "$(GRACE_PRIVACY_URL)"
        GraceHelpEmail: "$(GRACE_HELP_EMAIL)"
    preBuildScripts:
      - name: Check production configuration
        script: 'if [ "$CONFIGURATION" = "Production" ]; then cd "$SRCROOT/.." && node tools/release-check.mjs; fi'
        basedOnDependencyAnalysis: false
  GraceAtHandTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GraceAtHand
      - package: GraceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GRACE_BUNDLE_ID).Tests"
        GENERATE_INFOPLIST_FILE: YES
  GraceAtHandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GraceAtHand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GRACE_BUNDLE_ID).UITests"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GraceAtHand:
    build:
      targets:
        GraceAtHand: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GraceAtHandTests
        - GraceAtHandUITests
    archive:
      config: Production
  GracePreview:
    build:
      targets:
        GraceAtHand: all
    run:
      config: Preview
  GraceStaging:
    build:
      targets:
        GraceAtHand: all
    run:
      config: Staging
