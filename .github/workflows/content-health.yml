name: Public content health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
jobs:
  health:
    if: vars.CONTENT_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node tools/content.mjs health
        env:
          CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
